# Experimental: check whether thin-edge.io can be built for 32-bit MIPS
# (mips = big-endian, mipsel = little-endian), with both musl and glibc.
#
# These are tier 3 targets since Rust 1.72, so there is no prebuilt std:
# nightly + -Zbuild-std is required.
#
# Two C toolchains are tested:
#   zig:   cargo-zigbuild (zig provides libc, libunwind and 64-bit atomics)
#   clang: clang + lld; musl, libunwind and libatomic are built from source for musl,
#          Ubuntu's gcc cross toolchain provides the glibc sysroot and linker for gnu
#
# Notes:
#   * musl binaries are built non-PIE (-C relocation-model=static): static-pie musl
#     binaries crash at startup, and zig 0.17 can't link them in release mode.
#   * rustc's musl targets are soft-float, the gnu targets are hard-float (fpxx),
#     so C code for musl must be built with -msoft-float.
#   * 32-bit MIPS has no 64-bit atomics; QuickJS needs __atomic_*_8 from a libatomic.
#
# Each job builds the release binaries and smoke tests them under qemu-user
# (--version, tedge config, tedge cert create (ring), tedge flows test (QuickJS)).
name: mipsel-build-test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/mipsel-build-test

env:
  NIGHTLY: nightly-2026-10-11
  ZIG_VERSION: "0.17.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.arch }} / ${{ matrix.libc }} / ${{ matrix.builder }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [mipsel, mips]
        libc: [musl, gnu]
        builder: [zig, clang]
    env:
      ID: ${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.builder }}
      TARGET: ${{ matrix.arch }}-unknown-linux-${{ matrix.libc }}
      # Name of the target with "-" replaced by "_" (for cc-rs / bindgen env vars)
      TARGET_ENV: ${{ matrix.arch }}_unknown_linux_${{ matrix.libc }}
      QEMU: qemu-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustc +"$NIGHTLY" --version

      - name: Install qemu-user and the glibc runtime for qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user "libc6-${{ matrix.arch }}-cross"

      - name: Install zig and cargo-zigbuild
        if: matrix.builder == 'zig'
        run: |
          pip3 install --break-system-packages "ziglang==$ZIG_VERSION"
          python3 -m ziglang version
          cargo install --locked cargo-zigbuild

      - name: Install clang toolchain
        if: matrix.builder == 'clang'
        run: |
          sudo apt-get install -y clang lld llvm
          clang --version

      - name: Install gcc cross toolchain (gnu sysroot and linker)
        if: matrix.builder == 'clang' && matrix.libc == 'gnu'
        run: |
          sudo apt-get install -y "gcc-${{ matrix.arch }}-linux-gnu" "libc6-dev-${{ matrix.arch }}-cross"
          "${{ matrix.arch }}-linux-gnu-gcc" --version

      - name: Build (zig)
        if: matrix.builder == 'zig'
        env:
          RUSTFLAGS: ${{ matrix.libc == 'musl' && '-C relocation-model=static' || '' }}
        run: |
          ZIG_TARGET="$TARGET"
          # Pin the minimum glibc version
          [ "${{ matrix.libc }}" = gnu ] && ZIG_TARGET="$TARGET.2.28"
          cargo +"$NIGHTLY" zigbuild \
            -Zbuild-std=std,panic_abort \
            --release \
            --target "$ZIG_TARGET" \
            --workspace --bins

      - name: Set up clang build (musl)
        if: matrix.builder == 'clang' && matrix.libc == 'musl'
        run: |
          SYSROOT="$RUNNER_TEMP/${{ matrix.arch }}-musl"
          LIBUNWIND_SRC="$(rustc +"$NIGHTLY" --print sysroot)/lib/rustlib/src/rust/src/llvm-project/libunwind"
          sh ci/build_scripts/mips/setup-musl-clang.sh "${{ matrix.arch }}" "$SYSROOT" "$LIBUNWIND_SRC"

          CLANG_ARGS="--target=${{ matrix.arch }}-linux-musl -march=mips32r2 -msoft-float --sysroot=$SYSROOT"
          {
            echo "CC_$TARGET_ENV=clang"
            echo "CFLAGS_$TARGET_ENV=$CLANG_ARGS"
            echo "AR_$TARGET_ENV=llvm-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS_$TARGET_ENV=$CLANG_ARGS"
            echo "CARGO_TARGET_${TARGET_ENV^^}_LINKER=$SYSROOT/bin/${{ matrix.arch }}-linux-musl-clang"
            echo "RUSTFLAGS=-C target-feature=+crt-static -C link-self-contained=no -C relocation-model=static"
          } | tee -a "$GITHUB_ENV"

      - name: Set up clang build (gnu)
        if: matrix.builder == 'clang' && matrix.libc == 'gnu'
        run: |
          GNU_SYSROOT="/usr/${{ matrix.arch }}-linux-gnu"
          ATOMIC_DIR="$RUNNER_TEMP/atomic"
          # Ubuntu's libatomic.a is not PIC, so it can't be linked into the PIE binaries
          sh ci/build_scripts/mips/build-libatomic.sh "${{ matrix.arch }}-linux-gnu" "$ATOMIC_DIR" --sysroot="$GNU_SYSROOT"

          CLANG_ARGS="--target=${{ matrix.arch }}-linux-gnu --sysroot=$GNU_SYSROOT"
          {
            echo "CC_$TARGET_ENV=clang"
            echo "CFLAGS_$TARGET_ENV=$CLANG_ARGS"
            echo "AR_$TARGET_ENV=${{ matrix.arch }}-linux-gnu-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS_$TARGET_ENV=$CLANG_ARGS"
            echo "CARGO_TARGET_${TARGET_ENV^^}_LINKER=${{ matrix.arch }}-linux-gnu-gcc"
            echo "RUSTFLAGS=-C link-arg=$ATOMIC_DIR/libatomic.a"
          } | tee -a "$GITHUB_ENV"

      - name: Build (clang)
        if: matrix.builder == 'clang'
        run: |
          cargo +"$NIGHTLY" build \
            -Zbuild-std=std,panic_abort \
            --release \
            --target "$TARGET" \
            --workspace --bins

      - name: Collect binaries and build info
        run: |
          OUT="$RUNNER_TEMP/dist/$ID"
          mkdir -p "$OUT"
          for b in tedge tedge-write tedge-shell-plugin tedge-file-log-plugin tedge-file-config-plugin tedge-p11-server; do
            cp "target/$TARGET/release/$b" "$OUT/"
          done
          {
            echo "id:        $ID"
            echo "target:    $TARGET"
            echo "builder:   ${{ matrix.builder }}"
            if [ "${{ matrix.builder }}" = zig ]; then
              echo "zig:       $(python3 -m ziglang version)"
            else
              echo "clang:     $(clang --version | head -1)"
            fi
            echo "rustc:     $(rustc +"$NIGHTLY" --version)"
            echo "rustflags: ${RUSTFLAGS:-}"
            echo "commit:    $GITHUB_SHA"
            echo "run:       $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            (cd "$OUT" && file tedge*)
            echo
            (cd "$OUT" && sha256sum tedge*)
          } | tee "$OUT/BUILD-INFO.txt"

      - name: Smoke test under qemu-user
        run: |
          set -x
          BIN_DIR="$PWD/target/$TARGET/release"
          RUN="$QEMU -L /usr/${{ matrix.arch }}-linux-gnu"

          for b in tedge-write tedge-shell-plugin tedge-file-log-plugin tedge-file-config-plugin tedge-p11-server; do
            $RUN "$BIN_DIR/$b" --version
          done

          # tedge is a multicall binary dispatched on its own file name
          CFG="$RUNNER_TEMP/tedge-config"
          mkdir -p "$CFG/device-certs" "$CFG/mappers/local/flows"
          T="$RUN $BIN_DIR/tedge --config-dir $CFG"

          $T --version
          $T config set device.type mips-test
          test "$($T config get device.type)" = "mips-test"

          # ring / rcgen
          $T cert create --device-id "$ID"
          $T cert show

          # QuickJS
          cp tests/RobotFramework/tests/tedge_flows/greeting-flows/hello.js "$CFG/mappers/local/flows/"
          OUTPUT=$(echo '[te/device/main///m/env] {"temperature":23}' | $T flows test --flow "$CFG/mappers/local/flows/hello.js")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Hello World!"

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tedge-${{ env.ID }}
          path: ${{ runner.temp }}/dist/${{ env.ID }}
          if-no-files-found: ignore
